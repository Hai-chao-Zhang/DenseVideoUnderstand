# highmotion_generation.yaml
task: "densevideo_highmotion"
# Keep the public high-motion smoke/evaluation default at 1k examples.
# The full HF split has 3,243 examples; set DENSEVIDEO_HIGHMOTION_MAX_EXAMPLES=0
# to evaluate every example after the dataset is accessible in your HF cache.
test_split: test
process_docs: !function utils.highmotion_select_1000
output_type: generate_until

doc_to_visual: !function utils.lpm_doc_to_visual
doc_to_text: !function utils.highmotion_doc_to_text
doc_to_target: !function utils.highmotion_doc_to_answer
process_results: !function utils.highmotion_process_results

metric_list:
  - metric: grid_acc
    aggregation: !function utils.highmotion_aggregate_grid_acc
    higher_is_better: true
  - metric: grid_ade
    aggregation: !function utils.highmotion_aggregate_grid_ade
    higher_is_better: false
  - metric: grid_fde
    aggregation: !function utils.highmotion_aggregate_grid_fde
    higher_is_better: false
  - metric: grid_transition_acc
    aggregation: !function utils.highmotion_aggregate_grid_transition_acc
    higher_is_better: true
  - metric: token_f1
    aggregation: !function utils.lpm_aggregate_token_f1
    higher_is_better: true

include: _highmotion_template_yaml

generation_kwargs:
  until:
    - "ASSISTANT:"
  image_aspect_ratio: original
  max_new_tokens: 64
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
