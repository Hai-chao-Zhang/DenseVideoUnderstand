name: Minimal release checks

on:
  push:
    branches: [release/dive-bench-minimal]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'PyYAML>=6' 'pytest>=8,<9'
      - run: python -m tools.densevideo.rebuild_published_leaderboard --verify-only
      - run: python -m pytest -q tests/densevideo/test_published_leaderboard.py
  cpu-install-and-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install torch==2.9.0 torchvision==0.24.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: python -m build
      - name: Installed CLI smoke outside the source directory
        working-directory: /tmp
        run: |
          lmms-eval --help
          dive-reproduce --profile route31 --output /tmp/dive-route31-plan
          dive-reproduce --profile qwen3 --output /tmp/dive-qwen3-plan
          dive-reproduce --profile qwen7 --output /tmp/dive-qwen7-plan
          dive-leaderboard --bundle "$GITHUB_WORKSPACE/release/2026-08-20" --verify-only
